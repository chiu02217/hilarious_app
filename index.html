<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riddle Challenge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="loading-screen" class="screen">
      <h1>🤔 Riddle Challenge</h1>
      <p>Loading your riddle...</p>
      <div class="spinner"></div>
    </div>

    <div id="riddle-screen" class="screen hidden">
      <div class="header">
        <h2>Solve the Riddle!</h2>
        <div class="timer">
          Time left: <span id="timer-display">60</span>s
        </div>
      </div>

      <div class="riddle-container">
        <p id="riddle-text" class="riddle-text"></p>
      </div>

      <div class="answer-container">
        <input
          type="text"
          id="answer-input"
          placeholder="Type your answer here..."
          autocomplete="off"
        />
        <button id="submit-btn">Submit Answer</button>
      </div>

      <div id="warning-message" class="warning hidden">
        ⚠️ Window is growing! Answer quickly!
      </div>
    </div>

    <div id="result-screen" class="screen hidden">
      <div id="result-content">
        <h2 id="result-title"></h2>
        <p id="result-message"></p>
        <button id="restart-btn">Try Another Riddle</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
