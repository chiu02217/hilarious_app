<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riddle Challenge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="topic-screen" class="screen">
      <h1>🎯 Quiz Setup</h1>
      <div class="setup-container">
        <div class="form-group">
          <label for="topic-input">Topic:</label>
          <input
            type="text"
            id="topic-input"
            placeholder="e.g., rizz, programming, trivia..."
            autocomplete="off"
          />
        </div>
        <div class="form-group">
          <label for="count-input">Number of Questions:</label>
          <input
            type="number"
            id="count-input"
            min="1"
            max="20"
            value="5"
          />
        </div>
        <button id="generate-btn">Generate Questions</button>
      </div>
    </div>

    <div id="loading-screen" class="screen hidden">
      <h1>🤔 Generating Questions...</h1>
      <p>Please wait while we create your quiz...</p>
      <div class="spinner"></div>
    </div>

    <div id="riddle-screen" class="screen hidden">
      <div class="header">
        <h2>Solve the Question!</h2>
        <div class="progress">
          Question <span id="current-question">1</span> of <span id="total-questions">5</span>
        </div>
        <div class="timer">
          Time left: <span id="timer-display">60</span>s
        </div>
      </div>

      <div class="riddle-container">
        <p id="riddle-text" class="riddle-text"></p>
      </div>

      <div class="answer-container">
        <input
          type="text"
          id="answer-input"
          placeholder="Type your answer here..."
          autocomplete="off"
        />
        <button id="submit-btn">Submit Answer</button>
      </div>

      <div id="warning-message" class="warning hidden">
        ⚠️ Window is growing! Answer quickly!
      </div>
    </div>

    <div id="result-screen" class="screen hidden">
      <div id="result-content">
        <h2 id="result-title"></h2>
        <p id="result-message"></p>
        <button id="restart-btn">Start New Quiz</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
